name: Update snake library

on:
  schedule:
    - cron: "0 1 * * *" # 09:00 Asia/Shanghai, GitHub may delay execution
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  update-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install image decoder
        run: python -m pip install 'Pillow>=11,<13'
      - name: Verify synchronization invariants
        run: python skills/snake-topics-daily/scripts/test_sync.py
      - name: Import visually verified Topics photos
        run: python scripts/sync_catalog.py --pending-only
      - name: Discover recent candidates for review
        if: github.event_name != 'push'
        env:
          SNAKE_TOPIC_TOKEN: ${{ secrets.SNAKE_TOPIC_TOKEN }}
        run: |
          python scripts/sync_catalog.py
          python - <<'PYCODE'
          import json
          from pathlib import Path
          topics = json.loads(Path('scripts/topic_review_queue.json').read_text())['topics']
          if topics:
              raise SystemExit('New candidates require visual review; see Topics review queue artifact. Discovery is not archival completion.')
          PYCODE
      - name: Preserve review queue
        if: always() && github.event_name != 'push'
        uses: actions/upload-artifact@v4
        with:
          name: topics-review-queue
          path: scripts/topic_review_queue.json
          if-no-files-found: ignore
      - name: Save verified archive
        run: |
          git config user.name "snake-library-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/topic_photo_index.json docs/species_catalog.json docs/photos
          git diff --cached --quiet || git commit -m "Archive visually verified Topics photos"
          git push
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deployment
        uses: actions/deploy-pages@v4
