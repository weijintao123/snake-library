name: Update snake library

on:
  schedule:
    - cron: "0 1 * * *" # 09:00 China Standard Time
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  update-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Import visually verified Topic photos
        run: |
          if [ -f topic-import-v1.zip ]; then
            unzip -o topic-import-v1.zip
            python - <<'PY'
          import json, shutil
          from datetime import datetime, timezone
          from pathlib import Path
          incoming = json.loads(Path("topic_import/index.json").read_text(encoding="utf-8"))
          target = Path("docs/topic_photo_index.json")
          current = json.loads(target.read_text(encoding="utf-8"))
          photos = current.setdefault("photos", [])
          known = {item.get("sha256") for item in photos}
          for item in incoming["photos"]:
              if item["sha256"] in known:
                  continue
              source = Path("topic_import") / item["site_id"] / (item["sha256"] + ".webp")
              destination = Path("docs") / item["path"]
              destination.parent.mkdir(parents=True, exist_ok=True)
              if not destination.exists():
                  shutil.copyfile(source, destination)
              photos.append(item)
              known.add(item["sha256"])
          current["updated_at"] = datetime.now(timezone.utc).isoformat()
          target.write_text(json.dumps(current, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          PY
            rm -rf topic_import topic-import-v1.zip
            git config user.name "snake-library-bot"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -m "Import 15 visually verified Topic snake photos"
            git push
          fi
      - name: Remove legacy non-Topics gallery once
        run: |
          git rm -rf --ignore-unmatch docs/catalog.json docs/photo_index.json scripts/import_local_archive.py scripts/image_store.py scripts/sync_topics.py
          git config user.name "snake-library-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git diff --cached --quiet || git commit -m "Remove legacy snake gallery"
          git push
      - name: Archive new Topics photos only
        env:
          SNAKE_TOPIC_TOKEN: ${{ secrets.SNAKE_TOPIC_TOKEN }}
        run: |
          if [ -z "$SNAKE_TOPIC_TOKEN" ]; then
            echo "SNAKE_TOPIC_TOKEN is not configured; skipping Topics download."
            exit 0
          fi
          python scripts/sync_catalog.py
      - name: Save expanded Topics photo archive
        run: |
          git add docs/topic_photo_index.json docs/species_catalog.json
          if [ -f docs/topic_sync_state.json ]; then git add docs/topic_sync_state.json; fi
          if [ -d docs/photos ]; then git add docs/photos; fi
          git diff --cached --quiet || git commit -m "Archive new Topics photos"
          for attempt in 1 2 3; do
            git pull --rebase origin main && git push && break
            git rebase --abort 2>/dev/null || true
            if [ "$attempt" = 3 ]; then exit 1; fi
            sleep $((attempt * 5))
          done
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deployment
        uses: actions/deploy-pages@v4

