name: Update snake library

on:
  schedule:
    - cron: "0 1 * * *" # 09:00 China Standard Time
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  update-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Apply UTF-8 species-folder migration
        run: |
          if [ -f species-update-v3b.zip ]; then
            unzip -o species-update-v3b.zip
            find docs/photos -type f -name .gitkeep -delete 2>/dev/null || true
            find docs/photos -depth -type d -empty -delete 2>/dev/null || true
            python - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path("docs/species_catalog.json").read_text(encoding="utf-8"))
          for species in data["species"]:
              folder = Path("docs/photos") / species["folder"]
              folder.mkdir(parents=True, exist_ok=True)
              (folder / ".gitkeep").touch()
          PY
            rm species-update-v3b.zip species-update.zip 2>/dev/null || true
            git config user.name "snake-library-bot"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -m "Fix 152 UTF-8 species folder names"
            git push
          fi
      - name: Remove legacy non-Topics gallery once
        run: |
          git rm -rf --ignore-unmatch docs/catalog.json docs/photo_index.json scripts/import_local_archive.py scripts/image_store.py scripts/sync_topics.py
          git config user.name "snake-library-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git diff --cached --quiet || git commit -m "Remove legacy snake gallery"
          git push
      - name: Archive new Topics photos only
        env:
          SNAKE_TOPIC_TOKEN: ${{ secrets.SNAKE_TOPIC_TOKEN }}
        run: |
          if [ -z "$SNAKE_TOPIC_TOKEN" ]; then
            echo "SNAKE_TOPIC_TOKEN is not configured; skipping Topics download."
            exit 0
          fi
          python scripts/sync_catalog.py
      - name: Save expanded Topics photo archive
        run: |
          git add docs/topic_photo_index.json docs/species_catalog.json
          if [ -f docs/topic_sync_state.json ]; then git add docs/topic_sync_state.json; fi
          if [ -d docs/photos ]; then git add docs/photos; fi
          git diff --cached --quiet || git commit -m "Archive new Topics photos"
          for attempt in 1 2 3; do
            git pull --rebase origin main && git push && break
            git rebase --abort 2>/dev/null || true
            if [ "$attempt" = 3 ]; then exit 1; fi
            sleep $((attempt * 5))
          done
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deployment
        uses: actions/deploy-pages@v4

