<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>待分类蛇图</title><style>body{font:16px sans-serif;max-width:1100px;margin:30px auto;padding:16px;background:#f5f6f4}main{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:16px}article{background:white;padding:12px;overflow-wrap:anywhere}img{width:100%;height:280px;object-fit:contain}p{line-height:1.6}</style><a href="./">返回分类图库</a><h1>待分类蛇图</h1><p>已确认图片含蛇，但物种仍待核验。以下名称仅为来源标注，不作为鉴定结论。共24条来源记录，保留下载文件及来源。</p><main id="list"></main><script>fetch("topic_review_saved_index.json").then(r=>r.json()).then(d=>{for(const p of d.photos){const a=document.createElement("article"),link=document.createElement("a"),im=document.createElement("img"),tx=document.createElement("p"),src=document.createElement("a");im.src=p.path;im.alt="待分类蛇照片";link.href=p.path;link.append(im);tx.textContent="来源标注："+p.source_label.chinese_name+" / "+p.source_label.scientific_name;src.href=p.url;src.textContent="来源图片";a.append(link,tx,src);document.getElementById("list").append(a)}})</script></html>
