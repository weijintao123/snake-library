<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>待分类蛇图</title><style>body{font:16px system-ui,sans-serif;max-width:1100px;margin:30px auto;padding:16px;background:#f5f6f4}main{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:16px}article{background:white;padding:12px;border-radius:8px;overflow-wrap:anywhere}img{width:100%;height:240px;object-fit:contain}</style><a href="./">返回分类图库</a><h1>待分类蛇图</h1><p id="summary">正在读取图片…</p><main></main><script>fetch("topic_review_saved_index.json").then(r=>{if(!r.ok)throw Error();return r.json()}).then(d=>{document.getElementById("summary").textContent=d.photos.length+"张图片已确认含蛇，名称仅为来源标注，物种仍待核验。";for(const p of d.photos){const a=document.createElement("article"),link=document.createElement("a"),im=document.createElement("img"),label=document.createElement("p");im.src=p.path;im.alt="待核验蛇图";link.href=p.path;link.append(im);label.textContent=p.source_label.chinese_name+" / "+p.source_label.scientific_name;a.append(link,label);document.querySelector("main").append(a)}}).catch(()=>document.getElementById("summary").textContent="读取失败，请刷新。")</script></html>
