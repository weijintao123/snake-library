<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>待分类蛇图</title><style>body{font:16px sans-serif;max-width:1100px;margin:30px auto;padding:16px;background:#f5f6f4}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:16px}article{background:white;padding:12px;overflow-wrap:anywhere}img{width:100%;height:280px;object-fit:contain}p{line-height:1.6}h2{margin-top:32px}a{color:#245c3b}</style><a href="./">返回分类图库</a><h1>待分类蛇图</h1><p id="summary">24张蛇图，按来源标注整理为19个待核验文件夹。来源名称可能错误，不作为鉴定结论。</p><main id="list"></main><script>fetch("topic_review_saved_index.json").then(r=>{if(!r.ok)throw Error("加载失败");return r.json()}).then(d=>{const groups=new Map();for(const p of d.photos){const key=p.folder||"待核验";if(!groups.has(key))groups.set(key,[]);groups.get(key).push(p)}document.getElementById("summary").textContent=d.photos.length+"张蛇图，"+groups.size+"个待核验文件夹。以下名称仅为来源标注，不作为鉴定结论。";for(const [name,photos] of groups){const s=document.createElement("section"),h=document.createElement("h2"),g=document.createElement("div");h.textContent="来源标注："+name+"（"+photos.length+"张）";g.className="grid";for(const p of photos){const a=document.createElement("article"),link=document.createElement("a"),im=document.createElement("img"),src=document.createElement("a"),tx=document.createElement("p");im.src=p.path;im.alt="待核验蛇图："+p.source_label.chinese_name;link.href=p.path;link.append(im);tx.textContent="来源标注："+p.source_label.chinese_name+" / "+p.source_label.scientific_name;src.href=p.url;src.textContent="来源图片";a.append(link,tx,src);g.append(a)}s.append(h,g);document.getElementById("list").append(s)}}).catch(()=>document.getElementById("summary").textContent="图片索引加载失败，请刷新重试。")</script></html>
